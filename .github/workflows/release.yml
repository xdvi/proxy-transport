name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            target_name: linux-x86_64
            archive_ext: tar.xz
            os_tag: linux
          - target: aarch64-linux-gnu
            target_name: linux-aarch64
            archive_ext: tar.xz
            os_tag: linux
          - target: x86_64-linux-musl
            target_name: linux-x86_64-musl
            archive_ext: tar.xz
            os_tag: linux
          - target: aarch64-linux-musl
            target_name: linux-aarch64-musl
            archive_ext: tar.xz
            os_tag: linux
          - target: aarch64-macos
            target_name: macos-aarch64
            archive_ext: tar.xz
            os_tag: macos
          - target: x86_64-macos
            target_name: macos-x86_64
            archive_ext: tar.xz
            os_tag: macos
          - target: x86_64-windows
            target_name: windows-x86_64
            archive_ext: zip
            os_tag: windows
          - target: aarch64-windows
            target_name: windows-aarch64
            archive_ext: zip
            os_tag: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: '0.16.0'

      - name: Build Release Packages
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ARCHIVE="proxy-transport-${TAG}-${{ matrix.target_name }}.${{ matrix.archive_ext }}"

          # Build shared library (ReleaseSmall for minimal binary footprint)
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -Dshared=true --prefix build-shared

          # Build static library (ReleaseSmall)
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -Dshared=false --prefix build-static

          # Assemble package directory
          mkdir -p dist/pkg/lib dist/pkg/include
          cp include/proxy_transport.h dist/pkg/include/
          cp README.md LICENSE dist/pkg/

          if [ "${{ matrix.os_tag }}" = "linux" ]; then
            cp build-shared/lib/libproxy_transport.so dist/pkg/lib/
            cp build-static/lib/libproxy_transport.a dist/pkg/lib/
          elif [ "${{ matrix.os_tag }}" = "macos" ]; then
            cp build-shared/lib/libproxy_transport.dylib dist/pkg/lib/
            cp build-static/lib/libproxy_transport.a dist/pkg/lib/
          elif [ "${{ matrix.os_tag }}" = "windows" ]; then
            mkdir -p dist/pkg/bin
            cp build-shared/bin/proxy_transport.dll dist/pkg/bin/
            cp build-shared/lib/proxy_transport.lib dist/pkg/lib/
            cp build-static/lib/proxy_transport.lib dist/pkg/lib/proxy_transport_static.lib
          fi

          # Create high-compression archive
          if [ "${{ matrix.archive_ext }}" = "tar.xz" ]; then
            tar -cJf "dist/${ARCHIVE}" -C dist/pkg .
          else
            (cd dist/pkg && zip -9 -r "../${ARCHIVE}" .)
          fi

      - name: Upload Release Asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_name }}
          path: dist/proxy-transport-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum proxy-transport-* > SHA256SUMS.txt
          ls -la

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            dist/* \
            --title "$TAG" \
            --generate-notes 2>/dev/null || gh release upload "$TAG" dist/* --clobber
